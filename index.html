<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 보안 설정: 이 파일, Pretendard 폰트(cdn.jsdelivr.net), 사이트 아이콘(icons.duckduckgo.com),
     날씨(api.open-meteo.com, geocoding-api.open-meteo.com), 구글 검색만 허용합니다.
     무언가 추가했는데 오류 없이 안 되면 이 줄 때문이에요. 이렇게 주소를 넣으세요.
     - 이미지:         img-src 뒤에 이미지 주소 추가 (글 속 이미지면 data: 도)
     - 다른 폰트:      CSS 주소는 style-src 에, 폰트 파일 주소는 font-src 에 추가
                       (구글 폰트: https://fonts.googleapis.com / https://fonts.gstatic.com)
     - 다른 데이터:    connect-src 뒤에 주소 추가
     - 네이버 검색:    form-action 에 https://search.naver.com 추가, 그리고 아래 <form> 의
                       action 을 https://search.naver.com/search.naver 로, name="q" 를 name="query" 로 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://cdn.jsdelivr.net; font-src https://cdn.jsdelivr.net; img-src https://icons.duckduckgo.com; connect-src https://api.open-meteo.com https://geocoding-api.open-meteo.com; form-action https://www.google.com; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데이플립</title>
<!-- 폰트: Pretendard (애플 기본 서체 'SF Pro + 애플 SD 산돌고딕 Neo'와 닮은 무료 폰트) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  /* 색깔: 애플 색을 기준으로 맞춤. 여기 값을 바꾸면 전체 색이 바뀝니다 */
  :root {
    --wall: #e8e8ed;      /* 벽 (애플 회색. 흰 종이가 또렷이 보이도록 한 단계 진하게) */
    --wall-ink: #636366;  /* 벽 위 글씨 */
    --paper: #ffffff;     /* 종이 */
    --ink: #1d1d1f;       /* 글씨 (애플 검정) */
    --ink-soft: #6e6e73;  /* 작은 글씨 */
    --sun: #e30000;       /* 일요일, 공휴일 (애플 캘린더 빨강, 글씨로 읽히게 조금 진하게) */
    --sat: #0066cc;       /* 토요일, 기념일 (애플 링크 파랑) */
    --binding: #1d1d1f;   /* 일력 위 검은 띠 */
    --pad-1: #dcdce1;     /* 일력 밑에 남은 종이 (가까운 장) */
    --pad-2: #d2d2d7;     /* 일력 밑에 남은 종이 (먼 장) */
    --chip: #dcdce1;      /* 단축키 표시·첫 글자 아이콘 바탕 */
    --chip-ink: #56565b;  /* 그 위 글씨 */
    --icon-plate: #dcdce1; /* 사이트 아이콘 받침 */
    --error: #c00000;     /* 벽 위 오류 글씨 (작은 글씨도 읽히게 진한 빨강) */
    --button: #0071e3;    /* 검색 버튼 (애플 파란 버튼) */
    --button-hover: #0060c0;
    --button-ink: #ffffff;
    --focus: #0071e3;     /* 키보드 포커스 테두리 */
    --wall-action: #0060c0; /* 벽 위 파란 글자 버튼 (회색 벽에서도 읽히게 조금 진하게) */
    --select: #b3d7ff;    /* 글자 선택 배경 */
    --radius: 18px;       /* 종이 모서리 (애플 카드처럼 둥글게) */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --wall: #000000;
      --wall-ink: #98989d;
      --paper: #1c1c1e;
      --ink: #f5f5f7;
      --ink-soft: #98989d;
      --sun: #ff453a;
      --sat: #2997ff;
      --binding: #3a3a3c;
      --pad-1: #2c2c2e;
      --pad-2: #232325;
      --chip: #2c2c2e;
      --chip-ink: #aeaeb2;
      --icon-plate: #8e8e93; /* 중간 회색: 검은 아이콘도 보이고 너무 튀지 않게 */
      --error: #ff6961;
      --button: #0071e3;
      --button-hover: #0060c0;
      --button-ink: #ffffff;
      --focus: #2997ff;
      --wall-action: #2997ff;
      --select: #3f638b;
      color-scheme: dark;
    }
    :root .num { font-weight: 350; } /* 어두운 바탕의 밝은 글씨는 한 단계 굵게 */
  }

  * { box-sizing: border-box; margin: 0; }
  html { background: var(--wall); }
  body {
    min-height: 100svh;
    background: var(--wall);
    color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    letter-spacing: -.01em;
    -webkit-font-smoothing: antialiased;
    caret-color: var(--focus);
  }
  ::selection { background: var(--select); color: var(--ink); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
  [hidden] { display: none !important; }

  main {
    display: grid;
    grid-template-columns: minmax(0, 9fr) minmax(0, 10fr);
    gap: clamp(32px, 6vw, 96px);
    max-width: 1500px;
    min-height: 100svh;
    margin: 0 auto;
    padding: clamp(28px, 6vh, 64px) clamp(24px, 5vw, 80px) clamp(56px, 8vh, 80px);
    align-items: start;
  }

  /* 종이: 벽보다 한 톤 밝은 면 + 둥근 모서리. 그림자·테두리 없이 색 차이로만 구분 */
  .paper {
    position: relative;
    background: var(--paper);
    border-radius: var(--radius);
  }

  /* ---- 일력 ---- */
  .calendar { position: sticky; top: clamp(28px, 6vh, 64px); isolation: isolate; }
  /* 일력 밑에 남은 종이 두 장: 조금씩 좁고 아래로 비어져 나옴 */
  .calendar::before, .calendar::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    z-index: -1;
  }
  .calendar::before { left: 8px; right: 8px; bottom: -6px; background: var(--pad-1); }
  .calendar::after { left: 18px; right: 18px; bottom: -12px; background: var(--pad-2); z-index: -2; }
  .sheet {
    display: flex;
    flex-direction: column;
    min-height: calc(100svh - clamp(28px, 6vh, 64px) - clamp(56px, 8vh, 80px));
    border-top: 14px solid var(--binding); /* 일력 위 검은 띠 */
    padding: clamp(20px, 3vh, 36px) clamp(24px, 3vw, 48px) clamp(18px, 3vh, 32px);
    font-variant-numeric: tabular-nums;
  }
  .sheet.torn {
    position: absolute;
    /* 띠는 벽에 남고 종이만 떨어집니다 */
    inset: 0 0 auto 0;
    border-top-color: transparent;
    background-clip: padding-box;
    transform-origin: 8% 0;
    pointer-events: none;
    z-index: 2;
  }
  .top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 4px 16px;
    font-size: clamp(17px, 1.5vw, 22px);
    font-weight: 600;
  }
  .lunar { font-size: .8em; font-weight: 500; color: var(--ink-soft); }
  .day {
    flex: 1;
    display: grid;
    place-content: center;
    text-align: center;
    padding: 2vh 0;
  }
  .num {
    /* 애플 캘린더 아이콘처럼 가늘고 큰 숫자 */
    font-weight: 300;
    font-size: clamp(9rem, min(42vh, 24vw), 28rem);
    line-height: .86;
    letter-spacing: -.04em;
  }
  .dow {
    margin-top: 1.5vh;
    font-size: clamp(26px, 3.4vw, 46px);
    font-weight: 600;
    letter-spacing: -.02em;
  }
  .holiday, .anniv {
    margin-top: 6px;
    font-size: clamp(15px, 1.4vw, 19px);
    font-weight: 600;
    color: var(--sun);
  }
  .anniv { color: var(--sat); } /* 기념일은 파랑 (공휴일 빨강과 구별) */
  .holiday:empty, .anniv:empty, .dday:empty { display: none; }
  /* 가장 가까운 D-day 하나: 작은 칩 */
  .dday { display: flex; justify-content: center; margin-top: 14px; }
  .dday-chip {
    display: inline-flex;
    gap: 6px;
    align-items: baseline;
    padding: 4px 12px;
    border-radius: 6px;
    background: var(--chip);
    color: var(--chip-ink);
    font-size: 15px;
    font-weight: 600;
  }
  .dday-chip b { color: var(--ink); font-weight: 600; }
  .is-sun .num, .is-sun .dow { color: var(--sun); }
  .is-sat .num, .is-sat .dow { color: var(--sat); }
  .foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px 16px;
    padding-top: 14px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .foot-right { display: flex; align-items: baseline; gap: 18px; margin-left: auto; }
  .clock, .wx-main {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -.02em;
    color: var(--ink);
  }
  /* 날씨: 시계 옆, 글자만. 누르면 출처(Open-Meteo)가 새 탭에서 열림 */
  .weather { display: inline-flex; align-items: baseline; gap: 8px; color: inherit; text-decoration: none; border-radius: 6px; }
  .weather:hover .wx-place { text-decoration: underline; text-underline-offset: 3px; }
  .wx-place, .wx-sub { font-size: 15px; font-weight: 600; color: var(--ink-soft); }
  .wx-main { font-variant-numeric: tabular-nums; }

  /* 일력 종이 아래 벽의 '설정' 버튼 */
  .settings-open { position: absolute; right: 0; top: calc(100% + 18px); }
  /* 일력 종이 뒷면 = 설정 */
  .sheet-back {
    position: absolute;
    inset: 0;
    z-index: 3;
    overflow: auto;
    overscroll-behavior: contain;
    border-top: 14px solid var(--binding);
    padding: clamp(20px, 3vh, 32px) clamp(24px, 3vw, 40px);
  }
  .calendar.is-back .sheet { visibility: hidden; }
  .set-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 22px; }
  .set-head h2 { margin: 0; font-size: 21px; color: var(--ink); }
  .set-body { display: grid; gap: 26px; }
  .set-body h3 { margin-bottom: 10px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
  .seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--wall); }
  .seg button {
    padding: 8px 16px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ink-soft);
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
  .field {
    width: 100%;
    min-width: 0;
    height: 44px;
    padding: 0 16px;
    border: 0;
    border-radius: 999px;
    background: var(--wall);
    color: var(--ink);
    font: inherit;
    font-size: 17px;
  }
  .field::placeholder { color: var(--ink-soft); }
  .row-form { display: flex; gap: 8px; }
  .row-form .pill-button { flex: none; width: auto; height: 44px; padding: 0 18px; }
  .set-note { margin-top: 8px; font-size: 15px; color: var(--ink-soft); }
  .set-note b { color: var(--ink); font-weight: 600; }
  .cands { display: grid; gap: 2px; margin-top: 8px; padding: 0; list-style: none; }
  .cands button {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 10px 14px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
  }
  .cands button:hover { background: var(--wall); }
  .cands small { color: var(--ink-soft); font-size: 13px; }
  .credit { margin-top: 8px; font-size: 13px; color: var(--ink-soft); }
  .credit a { color: inherit; text-underline-offset: 2px; }
  .dates { display: grid; gap: 2px; padding: 0; list-style: none; }
  .dates li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 8px 8px 8px 14px;
    border-radius: 6px;
    background: var(--wall);
    font-size: 15px;
  }
  .dates .date-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dates .date-when { margin-left: auto; color: var(--ink-soft); font-size: 13px; white-space: nowrap; }
  .dates .text-button { font-size: 13px; }
  .dates li.dates-empty { padding-left: 0; background: none; color: var(--ink-soft); }
  .date-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 8px; margin-top: 12px; align-items: center; }
  .date-form .wide { grid-column: 1 / -1; }
  .date-form select.field { width: auto; padding-right: 12px; }
  .lunar-pick { display: flex; gap: 8px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--ink); }
  .check input { width: 18px; height: 18px; accent-color: var(--button); }
  .date-form .pill-button { height: 44px; }

  /* ---- 오른쪽: 검색과 링크는 위에 붙이고, 메모는 아래로 내려 일력 아랫선에 맞춤 ---- */
  .tools {
    display: flex;
    flex-direction: column;
    gap: clamp(20px, 3vh, 40px);
    min-height: calc(100svh - clamp(28px, 6vh, 64px) - clamp(56px, 8vh, 80px));
  }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  h2 {
    margin-bottom: 14px;
    font-size: 15px;
    font-weight: 600;
    color: var(--wall-ink);
  }
  kbd {
    margin-left: 6px;
    padding: 1px 7px;
    border-radius: 6px;
    background: var(--chip);
    color: var(--chip-ink);
    font: inherit;
    font-size: 13px;
  }
  .search { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 999px; }
  .search input {
    flex: 1;
    min-width: 0;
    height: 48px;
    padding: 0 8px 0 16px;
    border: 0;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 20px;
    font-weight: 600;
  }
  .search input::-webkit-search-cancel-button { display: none; }
  .search input::placeholder { color: var(--ink-soft); }
  .search input:focus-visible { outline: none; }
  .search:focus-within { outline: 3px solid var(--focus); outline-offset: 4px; }
  .search button, .pill-button {
    width: 104px;
    height: 48px;
    border: 0;
    border-radius: 999px;
    background: var(--button);
    color: var(--button-ink);
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color .15s ease-out;
  }
  .search button:hover, .pill-button:hover { background: var(--button-hover); }

  /* 단축키 안내: 키보드를 쓰기 시작한 뒤, 빈 검색창에 있을 때만 보임 (자리는 미리 비워 둬서 아래를 밀지 않음) */
  .tools > section:first-child { position: relative; padding-bottom: 20px; }
  .key-hint {
    position: absolute;
    top: calc(100% - 20px);
    margin-top: 12px;
    font-size: 13px;
    color: var(--wall-ink);
    opacity: 0;
    transition: opacity .2s ease-out;
  }
  .used-keyboard .search:has(input:focus):has(input:placeholder-shown) + .key-hint { opacity: 1; }
  .key-hint kbd:first-child { margin-left: 0; }
  @media (hover: none) {
    .key-hint, h2 kbd, a.link-card::before { display: none; } /* 키보드 없는 화면에선 단축키 표시를 숨김 */
    .tools > section:first-child { padding-bottom: 0; }
  }

  /* 제목 줄: 왼쪽 제목, 오른쪽 작은 글자 버튼 */
  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .section-head h2 { margin-bottom: 0; }
  .text-button {
    padding: 4px 8px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--focus);
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .text-button:hover { text-decoration: underline; text-underline-offset: 3px; }
  .text-button.is-danger { color: var(--sun); }
  .section-head .text-button, .links-status .text-button, .settings-open { color: var(--wall-action); }
  .head-actions { display: flex; gap: 4px; }

  .links {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    list-style: none;
    padding: 0;
    counter-reset: link;
  }
  .links li { position: relative; }
  /* 링크 카드: 위에 사이트 아이콘, 아래에 이름과 주소 */
  .link-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    min-height: 116px;
    padding: 16px 20px;
    border: 0;
    color: var(--ink);
    font: inherit;
    text-align: left;
    text-decoration: none;
    cursor: pointer;
    transition: transform .2s cubic-bezier(.2, .8, .2, 1);
  }
  .favicon, .monogram { flex: none; width: 28px; height: 28px; border-radius: 6px; }
  .favicon { padding: 4px; background: var(--icon-plate); } /* 흰색·검은색 아이콘도 보이게 받침 */
  .monogram {
    display: grid;
    place-items: center;
    background: var(--chip);
    color: var(--chip-ink);
    font-size: 15px;
    font-weight: 600;
  }
  .link-card .label { display: flex; flex-direction: column; min-width: 0; }
  .link-card .name, .link-card .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-card.is-add { justify-content: center; align-items: center; color: var(--focus); font-size: 17px; font-weight: 600; }
  /* 오른쪽 위 작은 숫자 = 그 숫자 키를 누르면 바로 열림 (화면 읽기 프로그램은 읽지 않음). 편집 중에도 보임 */
  .link-card:not(.is-add)::before {
    counter-increment: link;
    content: counter(link);      /* 오래된 브라우저용 */
    content: counter(link) / "";
    position: absolute;
    top: 14px;
    right: 18px;
    padding: 1px 7px;
    border-radius: 6px;
    background: var(--chip);
    color: var(--chip-ink);
    font-size: 13px;
    font-weight: 600;
  }
  /* 편집 중: 순서 바꾸기 버튼(앞으로·뒤로), 카드 오른쪽 아래 */
  .move { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; }
  .move button {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: var(--chip);
    color: var(--chip-ink);
    cursor: pointer;
  }
  .move button:disabled { opacity: .35; cursor: default; }
  .move svg { width: 14px; height: 14px; }
  .links:not(.is-many) button.link-card:not(.is-add) .label { padding-right: 68px; } /* 순서 버튼과 겹치지 않게 */
  /* 사이트가 5개 이상이면 넓은 화면에서 3줄로, 카드는 낮게 (메모가 화면 밖으로 밀리지 않게) */
  .links.is-many .link-card {
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    min-height: 64px;
    gap: 10px;
    padding: 12px 40px 12px 14px; /* 오른쪽은 숫자 칩 자리 */
  }
  .links.is-many .link-card::before { top: 50%; transform: translateY(-50%); right: 14px; }
  .links.is-many .link-card.is-add { justify-content: center; padding: 12px 16px; }
  .links.is-many .name { font-size: 17px; }
  .links.is-many .url { display: none; }
  .links.is-many button.link-card:not(.is-add) { padding-right: 116px; } /* 숫자 칩 + 순서 버튼 자리 */
  .links.is-many button.link-card:not(.is-add)::before { right: 84px; }
  .links.is-many .move { top: 50%; bottom: auto; right: 10px; transform: translateY(-50%); }
  @media (min-width: 1200px) {
    .links.is-many { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 520px) {
    .links.is-many { grid-template-columns: minmax(0, 1fr); } /* 좁은 휴대폰은 한 줄에 하나씩 */
  }
  @media (hover: none) {
    .links.is-many a.link-card { padding-right: 14px; } /* 숫자 칩이 숨겨지니 그 자리도 비우지 않음 */
  }
  .link-card.is-editing { outline: 3px dashed var(--focus); outline-offset: 3px; } /* 점선 = 지금 고치는 카드 (실선 = 포커스) */
  .links.is-adding .is-add { display: none; }
  .links-empty { grid-column: 1 / -1; padding: 8px 0; font-size: 15px; color: var(--wall-ink); }
  .link-card:hover, .link-card:focus-visible { transform: translateY(-3px); }

  /* 삭제·기본 목록 뒤 '되돌리기' 줄 */
  .links-status { display: flex; align-items: baseline; gap: 4px; font-size: 15px; color: var(--wall-ink); }
  .links-status.is-shown { margin-top: 12px; }
  .sheet-back .links-status { color: var(--ink-soft); }
  .sheet-back .links-status .text-button { color: var(--focus); }

  /* 사이트 추가·고치기 칸 */
  .link-form { display: grid; gap: 14px; margin-top: 18px; padding: 20px 22px; }
  .link-form h3 { font-size: 17px; font-weight: 600; }
  .link-form label { display: grid; gap: 6px; font-size: 15px; font-weight: 600; color: var(--ink-soft); }
  .link-form input {
    height: 44px;
    padding: 0 16px;
    border: 0;
    border-radius: 999px;
    background: var(--wall);
    color: var(--ink);
    font: inherit;
    font-size: 17px;
    font-weight: 400;
  }
  .link-form input::placeholder { color: var(--ink-soft); font-style: normal; }
  .form-error { font-size: 13px; font-weight: 600; color: var(--sun); }
  .form-error:empty { display: none; }
  .form-actions { display: flex; align-items: center; gap: 12px; }
  .form-actions .pill-button { height: 44px; }
  .form-actions [data-action="delete"] { margin-left: auto; }
  .links .name { font-size: 21px; font-weight: 600; letter-spacing: -.02em; }
  .links .url { margin-top: 4px; font-size: 13px; color: var(--ink-soft); }

  .memo textarea {
    display: block;
    width: 100%;
    padding: 18px 64px 18px 22px; /* 오른쪽은 글자 수 표시 자리 */
    border: 0;
    border-radius: var(--radius);
    resize: none;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 19px;
    line-height: 1.7;
  }
  .memo textarea::placeholder { color: var(--ink-soft); }
  .memo textarea:focus-visible { outline: none; }
  .memo:focus-within { outline: 3px solid var(--focus); outline-offset: 4px; }
  .tools > section:last-child { position: relative; margin-top: auto; }
  /* 메모 안내는 늘 보임 (자정에 지워진다는 걸 미리 알 수 있게) */
  .hint {
    position: absolute; /* 메모 종이 아랫선이 일력 아랫선과 맞도록 아래에 매달기 */
    top: 100%;
    margin-top: 12px;
    font-size: 13px;
    color: var(--wall-ink);
  }
  .hint.is-error { color: var(--error); font-weight: 600; }
  .memo-count {
    position: absolute;
    right: 20px;
    bottom: 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .memo-count.is-full { color: var(--sun); }

  @media (prefers-reduced-motion: reduce) {
    .link-card, .key-hint { transition: none; }
    .link-card:hover, .link-card:focus-visible { transform: none; }
  }

  /* 창이 좁으면 위아래로 쌓기 */
  @media (max-width: 860px) {
    main { grid-template-columns: minmax(0, 1fr); row-gap: 72px; }
    .calendar { position: relative; top: 0; }
    .sheet, .tools { min-height: 0; }
    .tools { gap: 40px; }
    .num { font-size: clamp(8rem, 42vw, 14rem); }
    /* 좁은 화면: 설정 뒷면은 종이 대신 제자리에 펼침 */
    .sheet-back { position: relative; inset: auto; overflow: visible; }
    .calendar.is-back .sheet { display: none; }
  }
  @media (max-width: 520px) {
    .wx-place { display: none; } /* 아랫줄이 넘치지 않게 도시·날씨 낱말은 숨김 */
  }
</style>

<body>
<main>
  <h1 class="visually-hidden" data-t="appTitle">데이플립 (DayFlip)</h1>
  <section class="calendar" id="calendar" data-t-label="todayRegion" aria-label="오늘 날짜">
    <div class="sheet paper" id="sheet">
      <div class="top" aria-hidden="true">
        <span class="ym"></span>
        <span class="lunar"></span>
      </div>
      <div class="day" aria-hidden="true">
        <div class="num"></div>
        <div class="dow"></div>
        <div class="holiday"></div>
        <div class="anniv"></div>
        <div class="dday"></div>
      </div>
      <!-- 화면 읽기 프로그램용 한 문장 (예: 2026년 10월 29일 목요일, 음력 9월 19일) -->
      <p class="visually-hidden sheet-sentence"></p>
      <div class="foot">
        <span class="doy"></span>
        <div class="foot-right">
          <span class="weather-slot"></span>
          <time class="clock"></time>
        </div>
      </div>
    </div>

    <!-- 일력 종이 뒷면 = 설정. '설정'을 누르면 종이가 뒤집힙니다 -->
    <div class="sheet-back paper" id="sheet-back" role="region" aria-labelledby="settings-title" hidden>
      <div class="set-head">
        <h2 id="settings-title" tabindex="-1" data-t="settings">설정</h2>
        <button type="button" class="text-button" id="settings-done" data-t="done">완료</button>
      </div>
      <div class="set-body">
        <section>
          <h3 id="lang-label" data-t="language">언어</h3>
          <!-- 언어 이름은 언제나 그 언어 자기 이름으로 -->
          <div class="seg" role="group" aria-labelledby="lang-label">
            <button type="button" data-lang="ko" lang="ko">한국어</button>
            <button type="button" data-lang="en" lang="en">English</button>
          </div>
        </section>
        <section>
          <h3 id="region-label" data-t="region">달력 나라</h3>
          <div class="seg" role="group" aria-labelledby="region-label">
            <button type="button" data-region="KR" data-t="regionKR">한국</button>
            <button type="button" data-region="US" data-t="regionUS">미국</button>
          </div>
        </section>
        <section>
          <h3 id="city-label" data-t="city">날씨 도시</h3>
          <form class="row-form" id="city-form" novalidate>
            <input class="field" id="city-input" type="search" autocomplete="off" maxlength="100" aria-labelledby="city-label" aria-describedby="city-error" data-t-placeholder="cityPlaceholder">
            <button type="submit" class="pill-button" data-t="find">찾기</button>
          </form>
          <ul class="cands" id="city-cands"></ul>
          <p class="form-error" id="city-error" role="alert"></p>
          <p class="set-note" id="city-current"></p>
          <p class="credit">
            <span data-t="creditWeather">날씨</span>: <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> ·
            <span data-t="creditPlaces">도시</span>: <a href="https://www.geonames.org/" target="_blank" rel="noopener noreferrer">GeoNames</a>
          </p>
        </section>
        <section>
          <h3 id="dates-label" data-t="dates">기념일 · D-day</h3>
          <ul class="dates" id="dates-list" aria-labelledby="dates-label"></ul>
          <p class="links-status" id="dates-status" role="status"><span></span><button type="button" class="text-button" data-t="undo" hidden>되돌리기</button></p>
          <form class="date-form" id="date-form" novalidate>
            <input class="field wide" name="name" maxlength="20" autocomplete="off" data-t-placeholder="datePlaceholder" data-t-label="dateName" aria-describedby="date-error">
            <div class="seg" role="group" data-t-label="calendarKind">
              <button type="button" data-cal="solar" aria-pressed="true" data-t="solar">양력</button>
              <button type="button" data-cal="lunar" aria-pressed="false" data-t="lunar">음력</button>
            </div>
            <span></span>
            <input class="field wide" name="date" type="date" data-t-label="dateValue">
            <div class="lunar-pick wide" hidden>
              <select class="field" name="lunarMonth" data-t-label="lunarMonthLabel"></select>
              <select class="field" name="lunarDay" data-t-label="lunarDayLabel"></select>
            </div>
            <label class="check wide"><input type="checkbox" name="repeat" checked> <span data-t="repeat">해마다 반복 (끄면 D-day)</span></label>
            <p class="form-error wide" id="date-error" role="alert"></p>
            <button type="submit" class="pill-button" data-t="add">추가</button>
          </form>
        </section>
      </div>
    </div>

    <button type="button" class="text-button settings-open" id="settings-open" aria-controls="sheet-back" aria-expanded="false" data-t="settings">설정</button>
  </section>

  <div class="tools">
    <section>
      <h2 id="search-label"><span data-t="search">검색</span><span class="visually-hidden" data-t="searchNote"> (결과는 새 탭에서 열림)</span><kbd aria-hidden="true">/</kbd></h2>
      <!-- target="_blank" = 결과를 새 탭에서 열기 (이 시작 페이지는 그대로 남음) -->
      <form class="search paper" action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer" role="search">
        <input name="q" type="search" placeholder="구글에서 검색" data-t-placeholder="searchPlaceholder" aria-labelledby="search-label" aria-keyshortcuts="/" autocomplete="off" required>
        <button type="submit" data-t="searchButton">검색</button>
      </form>
      <p class="key-hint" id="key-hint" aria-hidden="true"></p>
    </section>

    <section>
      <div class="section-head">
        <h2 id="links-label"><span data-t="links">자주 가는 곳</span><span class="visually-hidden" id="links-note"></span></h2>
        <div class="head-actions">
          <button type="button" class="text-button" id="links-reset" data-t="reset" hidden>기본 목록으로</button>
          <button type="button" class="text-button" id="links-edit">편집</button>
        </div>
      </div>
      <!-- 링크 목록은 아래 <script>의 DEFAULT_LINKS 에 있어요.
           주의: 페이지의 '편집'으로 한 번이라도 고치면 이 브라우저에서는 그 목록이 먼저예요.
           파일의 목록을 다시 보려면 페이지에서 '편집' → '기본 목록으로'를 누르세요. (메모는 그대로) -->
      <ul class="links" aria-labelledby="links-label"></ul>
      <p class="links-status" id="links-status" role="status"><span></span><button type="button" class="text-button" data-t="undo" hidden>되돌리기</button></p>
      <form class="link-form paper" id="link-form" hidden novalidate>
        <h3 id="link-form-title"></h3>
        <label><span data-t="labelUrl">주소</span> <input name="url" inputmode="url" autocomplete="off" maxlength="2048" data-t-placeholder="placeholderUrl" aria-describedby="link-form-error"></label>
        <label><span data-t="labelName">이름 (선택)</span> <input name="name" maxlength="20" autocomplete="off" data-t-placeholder="placeholderName"></label>
        <p class="form-error" id="link-form-error" role="alert"></p>
        <div class="form-actions">
          <button type="submit" class="pill-button" data-t="save">저장</button>
          <button type="button" class="text-button" data-action="cancel" data-t="cancel">취소</button>
          <button type="button" class="text-button is-danger" data-action="delete" data-t="delete">삭제</button>
        </div>
      </form>
    </section>

    <section>
      <h2><label for="memo" data-t="memoTitle">오늘의 메모</label></h2>
      <div class="memo paper">
        <textarea id="memo" rows="2" maxlength="60" data-t-placeholder="memoPlaceholder" aria-describedby="memo-hint"></textarea>
        <span class="memo-count" id="memo-count" aria-hidden="true"></span>
      </div>
      <p class="hint" id="memo-hint" role="status"></p>
    </section>
  </div>
</main>

      errDateValue: 'Pick a date.',
      errDdayPast: "A D-day can't be in the past.",
      errDatesMax: (n) => `You can add up to ${n} anniversaries and D-days.`,
      dateAnnivSolar: (m, d) => `Every ${MONTHS_EN[m - 1]} ${d}`,
      dateAnnivLunar: (m, d) => `Every lunar ${m}/${d}`,

        0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Overcast', 45: 'Fog', 48: 'Fog',
        51: 'Drizzle', 53: 'Drizzle', 55: 'Drizzle', 56: 'Freezing drizzle', 57: 'Freezing drizzle',
        61: 'Rain', 63: 'Rain', 65: 'Heavy rain', 66: 'Freezing rain', 67: 'Freezing rain',
        71: 'Snow', 73: 'Snow', 75: 'Snow', 77: 'Snow grains', 80: 'Showers', 81: 'Showers', 82: 'Showers',
        85: 'Snow showers', 86: 'Snow showers', 95: 'Thunderstorm', 96: 'Hail storm', 97: 'Thunderstorm', 99: 'Hail storm'
      },
      yearMonth: (y, m) => `${MONTHS_EN[m - 1]} ${y}`,
      lunarLine: (m, d, leap) => `Lunar ${leap ? 'leap ' : ''}${m}/${d}`,
      dayOfYear: (n, y) => `Day ${n} of ${y}`,
      tabTitle: (m, d, w) => `${WEEKDAYS.en[w].slice(0, 3)}, ${MONTHS_EN[m - 1].slice(0, 3)} ${d} · DayFlip`,
      sentenceDate: (y, m, d, w) => `${WEEKDAYS.en[w]}, ${MONTHS_EN[m - 1]} ${d}, ${y}`,
      ddayChip: (n) => (n === 0 ? 'D-day' : `D-${n}`)
    }
  };

  // 언어·달력 나라: 이 브라우저에 기억. 처음엔 언어는 브라우저 언어, 달력 나라는 한국
  const LANG_KEY = 'start-page-lang';
  const REGION_KEY = 'start-page-region';
  function loadChoice(key, allowed, fallback) {
    try {
      const value = localStorage.getItem(key);
      return allowed.includes(value) ? value : fallback;
    } catch {
      return fallback;
    }
  }
  function saveChoice(key, value) {
    try { localStorage.setItem(key, value); } catch {}
  }
  let lang = loadChoice(LANG_KEY, ['ko', 'en'], (navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en');
  let region = loadChoice(REGION_KEY, ['KR', 'US'], 'KR');

  function t(key, ...args) {
    const value = key in TEXT[lang] ? TEXT[lang][key] : TEXT.ko[key];
    return typeof value === 'function' ? value(...args) : value;
  }

  // =====================================================================
  // 2. 공휴일
  //    [한국어 이름, 영어 이름, (이 해부터)] 모양으로 적어요.
  // =====================================================================
  // 한국 (양력) — '월-일'. 새 공휴일이 생기면 여기에 한 줄 추가하세요. ('03-01'처럼 0을 붙여도 괜찮아요)
  const KR_SOLAR = {
    '1-1': ['신정', "New Year's Day"],
    '3-1': ['삼일절', 'Independence Movement Day'],
    '5-1': ['노동절', 'Labor Day', 2026],
    '5-5': ['어린이날', "Children's Day"],
    '6-6': ['현충일', 'Memorial Day'],
    '7-17': ['제헌절', 'Constitution Day', 2026],
    '8-15': ['광복절', 'Liberation Day'],
    '10-3': ['개천절', 'National Foundation Day'],
    '10-9': ['한글날', 'Hangeul Day'],
    '12-25': ['성탄절', 'Christmas Day']
  };
  // 한국 (음력) — 음력으로 계산하니 해마다 고칠 필요 없어요. 설·추석은 앞뒤 하루도 연휴.
  const KR_LUNAR = { '1-1': ['설날', 'Seollal'], '4-8': ['부처님오신날', "Buddha's Birthday"], '8-15': ['추석', 'Chuseok'] };
  const KR_LUNAR_EVE = { '1-1': ['설날 연휴', 'Seollal Holiday'], '8-15': ['추석 연휴', 'Chuseok Holiday'] };
  // 한국, 해마다 날짜가 다른 휴일 — '연-월-일'. 새해가 되면 그해 대체공휴일·선거일을 여기에 추가하세요.
  const SUBSTITUTE = ['대체공휴일', 'Substitute Holiday'];
  const KR_EXTRA = {
    '2026-3-2': SUBSTITUTE,
    '2026-5-25': SUBSTITUTE,
    '2026-6-3': ['지방선거', 'Local Election Day'],
    '2026-8-17': SUBSTITUTE,
    '2026-10-5': SUBSTITUTE,
    '2027-2-9': SUBSTITUTE,
    '2027-5-3': SUBSTITUTE,
    '2027-7-19': SUBSTITUTE,
    '2027-8-16': SUBSTITUTE,
    '2027-10-4': SUBSTITUTE,
    '2027-10-11': SUBSTITUTE,
    '2027-12-27': SUBSTITUTE
  };
  // 미국 연방 공휴일 — [월, 날짜 또는 [요일(0=일), 몇째(-1=마지막)], 이름]
  const US_RULES = [
    [1, 1, ['새해 첫날', "New Year's Day"]],
    [1, [1, 3], ['마틴 루서 킹 데이', 'Martin Luther King Jr. Day']],
    [2, [1, 3], ['워싱턴 탄생일', "Washington's Birthday"]],
    [5, [1, -1], ['메모리얼 데이', 'Memorial Day']],
    [6, 19, ['준틴스', 'Juneteenth']],
    [7, 4, ['독립기념일', 'Independence Day']],
    [9, [1, 1], ['노동절', 'Labor Day']],
    [10, [1, 2], ['콜럼버스 데이', 'Columbus Day']],
    [11, 11, ['재향군인의 날', 'Veterans Day']],
    [11, [4, 4], ['추수감사절', 'Thanksgiving Day']],
    [12, 25, ['크리스마스', 'Christmas Day']]
  ];

  // '03-01' 처럼 0을 붙여 쓴 날짜도 '3-1' 로 맞춰서 찾음
  function unpadKeys(table) {
    return Object.fromEntries(Object.entries(table).map(([key, value]) => [key.split('-').map(Number).join('-'), value]));
  }
  const KR_SOLAR_BY_DAY = unpadKeys(KR_SOLAR);
  const KR_EXTRA_BY_DAY = unpadKeys(KR_EXTRA);

  // dangi = 한국 음력 (chinese는 중국 시간 기준이라 하루씩 틀릴 때가 있음)
  const lunarFormat = new Intl.DateTimeFormat('ko-KR-u-ca-dangi', { month: 'numeric', day: 'numeric' });
  function lunarInfo(date) {
    const parts = lunarFormat.formatToParts(date);
    const month = parts.find(p => p.type === 'month')?.value || '';
    const day = parts.find(p => p.type === 'day')?.value || '';
    return { month: Number(month.replace(/\D/g, '')), day: Number(day), leap: !/^\d+$/.test(month) };
  }
  // 윤달은 공휴일·기념일 계산에서 빼기 위해 평달만 '월-일'로 돌려줌
  function lunarKey(date) {
    const info = lunarInfo(date);
    return info.month && !info.leap ? `${info.month}-${info.day}` : '';
  }
  function addDays(date, n) {
    return new Date(date.getFullYear(), date.getMonth(), date.getDate() + n);
  }
  function sameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  }

  function koreanHoliday(date) {
    const y = date.getFullYear();
    const solar = KR_SOLAR_BY_DAY[`${date.getMonth() + 1}-${date.getDate()}`];
    if (solar && !(solar[2] && y < solar[2])) return solar;
    const extra = KR_EXTRA_BY_DAY[`${y}-${date.getMonth() + 1}-${date.getDate()}`];
    if (extra) return extra;
    const lunar = KR_LUNAR[lunarKey(date)];
    if (lunar) return lunar;
    for (const shift of [-1, 1]) {
      const eve = KR_LUNAR_EVE[lunarKey(addDays(date, shift))];
      if (eve) return eve;
    }
    return null;
  }

  // n번째 요일 (n=-1이면 그달 마지막 그 요일)
  function nthWeekday(y, month, weekday, n) {
    if (n > 0) return 1 + (weekday - new Date(y, month - 1, 1).getDay() + 7) % 7 + (n - 1) * 7;
    const last = new Date(y, month, 0);
    return last.getDate() - (last.getDay() - weekday + 7) % 7;
  }
  function usHoliday(date) {
    for (const [month, rule, name] of US_RULES) {
      if (typeof rule !== 'number') {
        if (date.getMonth() + 1 === month && date.getDate() === nthWeekday(date.getFullYear(), month, rule[0], rule[1])) return name;
        continue;
      }
      // 날짜가 정해진 공휴일: 그날, 그리고 주말이면 대신 쉬는 날(토→금, 일→월). 1/1이 토요일이면 전해 12/31
      for (const year of [date.getFullYear(), date.getFullYear() + 1]) {
        const day = new Date(year, month - 1, rule);
        if (sameDay(day, date)) return name;
        const shift = day.getDay() === 6 ? -1 : day.getDay() === 0 ? 1 : 0;
        if (shift && sameDay(addDays(day, shift), date)) return [`${name[0]} 대체휴일`, `${name[1]} (observed)`];
      }
    }
    return null;
  }
  function holidayFor(date) {
    return region === 'US' ? usHoliday(date) : koreanHoliday(date);
  }
  const pick = (pair) => (pair ? pair[lang === 'ko' ? 0 : 1] : '');

  // =====================================================================
  // 3. 기념일 · D-day (이 브라우저에만 저장)
  // =====================================================================
  const DATES_KEY = 'start-page-dates';
  const MAX_DATES = 20;

  // 이름: 글자 방향을 뒤집는 특수문자·제어문자를 빼고 20자까지 (이모지가 반으로 잘리지 않게 글자 단위로 자름)
  function cleanName(text) {
    return Array.from(String(text || '').replace(/[\u0000-\u001F\u061C\u200B-\u200F\u2028-\u202E\u2066-\u2069\uFEFF]/g, '').trim()).slice(0, 20).join('');
  }
  function cleanDate(item) {
    if (!item || typeof item !== 'object') return null;
    const name = cleanName(item.name);
    const repeat = item.repeat === true;
    const cal = item.cal === 'lunar' && repeat ? 'lunar' : 'solar';
    const m = Number(item.m);
    const d = Number(item.d);
    if (!name || !Number.isInteger(m) || !Number.isInteger(d) || m < 1 || m > 12 || d < 1) return null;
    if (cal === 'lunar') return d <= 30 ? { name, repeat, cal, m, d } : null;
    if (repeat) return d <= new Date(2024, m, 0).getDate() ? { name, repeat, cal, m, d } : null; // 2024는 윤년이라 2/29도 허용
    const y = Number(item.y);
    if (!Number.isInteger(y) || y < 1900 || y > 9999) return null;
    const real = new Date(y, m - 1, d);
    return real.getMonth() === m - 1 ? { name, repeat, cal, m, d, y } : null;
  }
  function loadDates() {
    try {
      const saved = JSON.parse(localStorage.getItem(DATES_KEY));
      if (Array.isArray(saved)) return saved.slice(0, MAX_DATES).map(cleanDate).filter(Boolean);
    } catch {}
    return [];
  }
  let dates = loadDates();
  function saveDates(next) {
    try {
      localStorage.setItem(DATES_KEY, JSON.stringify(next));
    } catch {
      return false;
    }
    dates = next;
    return true;
  }
  function daysUntil(item, today) {
    return Math.round((Date.UTC(item.y, item.m - 1, item.d) - Date.UTC(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
  }
  // 지난 D-day는 다음 날 자동으로 지움
  function prunePastDdays(today) {
    const next = dates.filter(item => item.repeat || daysUntil(item, today) >= 0);
    if (next.length !== dates.length) saveDates(next);
  }
  function isLeapYear(y) {
    return new Date(y, 1, 29).getMonth() === 1;
  }
  // 오늘의 기념일: 음력 30일이 없는 달은 29일에, 양력 2/29는 평년이면 2/28에, 윤달 기념일은 평달에
  function anniversariesOn(date) {
    const m = date.getMonth() + 1;
    const d = date.getDate();
    const lunar = lunarInfo(date);
    const tomorrow = lunarInfo(addDays(date, 1));
    return dates.filter(item => item.repeat).filter(item => {
      if (item.cal === 'solar') {
        return (item.m === m && item.d === d) || (item.m === 2 && item.d === 29 && m === 2 && d === 28 && !isLeapYear(date.getFullYear()));
      }
      if (lunar.leap || lunar.month !== item.m) return false;
      return lunar.day === item.d || (item.d === 30 && lunar.day === 29 && tomorrow.day === 1);
    }).map(item => item.name);
  }
  // 가장 가까운 D-day 하나 (날짜가 같으면 먼저 등록한 것)
  function nearestDday(date) {
    let best = null;
    for (const item of dates) {
      if (item.repeat) continue;
      const n = daysUntil(item, date);
      if (n >= 0 && (!best || n < best.n)) best = { n, name: item.name };
    }
    return best;
  }

  // =====================================================================
  // 4. 일력 종이
  // =====================================================================
  const calendar = document.getElementById('calendar');
  const sheet = document.getElementById('sheet');
  let shownDay = '';

  function dayOfYear(date) {
    const start = Date.UTC(date.getFullYear(), 0, 1);
    const today = Date.UTC(date.getFullYear(), date.getMonth(), date.getDate());
    return (today - start) / 86400000 + 1;
  }

  function fillSheet(el, date) {
    const y = date.getFullYear();
    const m = date.getMonth() + 1;
    const d = date.getDate();
    const week = date.getDay();
    const holiday = pick(holidayFor(date));
    const lunar = lunarInfo(date);
    const lunarLine = region === 'KR' && lunar.month ? t('lunarLine', lunar.month, lunar.day, lunar.leap) : '';
    const annivs = anniversariesOn(date);
    const dday = nearestDday(date);
    el.classList.toggle('is-sun', week === 0 || holiday !== '');
    el.classList.toggle('is-sat', week === 6 && holiday === '');
    el.querySelector('.ym').textContent = t('yearMonth', y, m);
    el.querySelector('.lunar').textContent = lunarLine;
    el.querySelector('.num').textContent = d;
    el.querySelector('.dow').textContent = WEEKDAYS[lang][week];
    el.querySelector('.holiday').textContent = holiday;
    el.querySelector('.anniv').textContent = annivs.join(' · ');
    const ddayBox = el.querySelector('.dday');
    ddayBox.replaceChildren();
    if (dday) {
      const chip = document.createElement('span');
      chip.className = 'dday-chip';
      const count = document.createElement('b');
      count.textContent = t('ddayChip', dday.n);
      chip.append(count, document.createTextNode(dday.name));
      ddayBox.append(chip);
    }
    el.querySelector('.doy').textContent = t('dayOfYear', dayOfYear(date), y);
    if (el !== sheet) return;
    document.title = t('tabTitle', m, d, week);
    const parts = [t('sentenceDate', y, m, d, week), lunarLine, holiday, ...annivs];
    if (dday) parts.push(`${dday.name} ${t('ddayChip', dday.n)}`);
    el.querySelector('.sheet-sentence').textContent = parts.filter(Boolean).join(', ');
  }

  // 날짜가 바뀌면 어제 종이를 찢어 떨어뜨립니다 (fromDate를 주면 그날 종이를 찢음)
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  function tearOff(fromDate) {
    if (reduceMotion() || calendar.classList.contains('is-back')) return;
    const torn = sheet.cloneNode(true);
    torn.removeAttribute('id');
    if (fromDate) fillSheet(torn, fromDate);
    torn.classList.add('torn');
    torn.setAttribute('aria-hidden', 'true');
    torn.querySelectorAll('a, button').forEach(node => node.setAttribute('tabindex', '-1'));
    sheet.after(torn);
    torn.animate([
      { transform: 'none', opacity: 1 },
      { transform: 'translateY(2%) rotate(-4deg)', opacity: 1, offset: .25 },
      { transform: 'translate(-6%, 70vh) rotate(-18deg)', opacity: 0 }
    ], { duration: 1100, easing: 'cubic-bezier(.5, 0, .75, .4)' }).onfinish = () => torn.remove();
  }

  // =====================================================================
  // 5. 상태 줄 + 되돌리기 (자주 가는 곳, 기념일에서 같이 씀)
  //    상태 줄은 늘 페이지에 있어서(비어 있을 뿐) 화면 읽기 프로그램이 새 글을 읽어 줌
  // =====================================================================
  function makeStatus(line, fallbackFocus) {
    const text = line.querySelector('span');
    const button = line.querySelector('button');
    let timer = 0;
    let undoAction = null;
    function hide() {
      if (line.contains(document.activeElement)) fallbackFocus().focus();
      text.textContent = '';
      button.hidden = true;
      line.classList.remove('is-shown');
      undoAction = null;
    }
    function show(message, onUndo = null) {
      text.textContent = message;
      undoAction = onUndo;
      button.hidden = !onUndo;
      line.classList.add('is-shown');
      clearTimeout(timer);
      timer = setTimeout(hide, 20000);
    }
    button.addEventListener('click', () => {
      const action = undoAction;
      if (action) action();
    });
    return { show, hide };
  }

  // =====================================================================
  // 6. 오늘의 메모: 이 브라우저(localStorage)에만 저장, 날짜가 바뀌면 지워짐
  // =====================================================================
  const MEMO_KEY = 'start-page-memo';
  const memo = document.getElementById('memo');
  const hint = document.getElementById('memo-hint');
  const memoCount = document.getElementById('memo-count');
  let memoError = '';
  let clearMemoOnBlur = false;

  function showHint() {
    hint.textContent = memoError ? t(memoError) : t('memoHint');
    hint.classList.toggle('is-error', memoError !== '');
  }
  function loadMemo(day) {
    const raw = localStorage.getItem(MEMO_KEY);
    if (!raw) return '';
    try {
      const saved = JSON.parse(raw);
      if (saved && typeof saved === 'object') {
        if (saved.day === day) return String(saved.text || '');
        localStorage.removeItem(MEMO_KEY); // 지난 날의 메모는 정말로 지움
        return '';
      }
    } catch {
      // 예전 형식(글자만 저장)은 오늘 메모로 그대로 살림
    }
    return raw;
  }
  function saveMemo() {
    try {
      localStorage.setItem(MEMO_KEY, JSON.stringify({ day: shownDay, text: memo.value }));
    } catch {
      memoError = 'memoSaveFail';
      showHint();
    }
  }
  // 50자를 넘으면 남은 글자 수를 보여 줌
  function updateMemoCount() {
    const length = memo.value.length;
    memoCount.textContent = length > 50 ? `${length}/${memo.maxLength}` : '';
    memoCount.classList.toggle('is-full', length >= memo.maxLength);
  }
  memo.addEventListener('input', () => {
    saveMemo();
    updateMemoCount();
  });
  // 자정에 메모를 쓰고 있었다면, 다 쓰고 빠져나올 때 정리함
  memo.addEventListener('blur', () => {
    if (!clearMemoOnBlur) return;
    clearMemoOnBlur = false;
    memo.value = '';
    try { localStorage.removeItem(MEMO_KEY); } catch {}
    updateMemoCount();
  });

  // =====================================================================
  // 7. 날씨 (Open-Meteo, 키 없이 쓰는 무료 서비스. 도시의 위도·경도만 보냄)
  // =====================================================================
  const CITY_KEY = 'start-page-city';
  const WEATHER_KEY = 'start-page-weather';
  const FRESH_MS = 30 * 60 * 1000;   // 30분마다 새로
  const KEEP_MS = 3 * 60 * 60 * 1000; // 연결이 안 되면 3시간까지는 저장본으로
  const weatherSlot = sheet.querySelector('.weather-slot');

  function readJson(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
  }
  function cleanCity(city) {
    if (!city || typeof city !== 'object') return null;
    const { id, lat, lon } = city;
    if (!Number.isInteger(id) || !Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
    const names = {};
    for (const code of ['ko', 'en']) {
      if (city.names && typeof city.names[code] === 'string') names[code] = cleanName(city.names[code]);
    }
    return { id, lat, lon, names };
  }
  let city = cleanCity(readJson(CITY_KEY));
  const getJson = async (url) => {
    const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
    if (!response.ok) throw new Error('bad response');
    return response.json();
  };
  let weatherBusy = false;

  function saveCity(next) {
    city = next;
    try {
      if (next) localStorage.setItem(CITY_KEY, JSON.stringify(next));
      else localStorage.removeItem(CITY_KEY);
      localStorage.removeItem(WEATHER_KEY);
    } catch {}
  }
  function cityName() {
    return city ? city.names[lang] || city.names.ko || city.names.en || '' : '';
  }
  // 고른 도시 이름을 다른 언어로도 받아 둠 (도시 번호로 한 번만)
  async function fetchCityName(code) {
    if (!city || city.names[code]) return;
    const id = city.id;
    try {
      const data = await getJson(`https://geocoding-api.open-meteo.com/v1/get?id=${id}&language=${code}`);
      if (!city || city.id !== id || typeof data.name !== 'string') return;
      saveCityName(code, data.name);
    } catch {}
  }
  function saveCityName(code, name) {
    city = { ...city, names: { ...city.names, [code]: cleanName(name) } };
    try { localStorage.setItem(CITY_KEY, JSON.stringify(city)); } catch {}
    renderWeather();
    renderCityNote();
  }

  function renderWeather() {
    weatherSlot.replaceChildren();
    if (!city) {
      const setup = document.createElement('button');
      setup.type = 'button';
      setup.className = 'text-button weather-setup';
      setup.textContent = t('showWeather');
      setup.addEventListener('click', () => openSettings('city-input'));
      weatherSlot.append(setup);
      return;
    }
    const saved = readJson(WEATHER_KEY);
    const fresh = saved && saved.cityId === city.id && Date.now() - saved.at < KEEP_MS && Number.isFinite(saved.temp) && Math.abs(saved.temp) < 100;
    if (!fresh) return; // 날씨가 없으면 조용히 비워 둠
    const celsius = Math.round(saved.temp);
    const fahrenheit = Math.round(saved.temp * 9 / 5 + 32);
    const [main, sub] = region === 'US' ? [`${fahrenheit}°F`, `${celsius}°C`] : [`${celsius}°C`, `${fahrenheit}°F`];
    const words = t('weatherWords');
    const word = Object.hasOwn(words, saved.code) ? words[saved.code] : '';
    const link = document.createElement('a');
    link.className = 'weather';
    link.href = 'https://open-meteo.com/';
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.title = t('weatherTitle');
    const place = document.createElement('span');
    place.className = 'wx-place';
    place.textContent = [cityName(), word].filter(Boolean).join(' · ');
    const big = document.createElement('span');
    big.className = 'wx-main';
    big.textContent = main;
    const small = document.createElement('span');
    small.className = 'wx-sub';
    small.textContent = sub;
    link.append(place, big, small);
    weatherSlot.append(link);
  }

  async function refreshWeather() {
    if (!city) return renderWeather();
    const saved = readJson(WEATHER_KEY);
    const isFresh = saved && saved.cityId === city.id && Date.now() - saved.at < FRESH_MS;
    if (isFresh || document.hidden || weatherBusy) return renderWeather();
    weatherBusy = true;
    const asked = city;
    try {
      const data = await getJson(`https://api.open-meteo.com/v1/forecast?latitude=${asked.lat}&longitude=${asked.lon}&current=temperature_2m,weather_code&timezone=auto`);
      const temp = Number(data?.current?.temperature_2m);
      const code = Number(data?.current?.weather_code);
      if (city && city.id === asked.id && Number.isFinite(temp) && Math.abs(temp) < 100) {
        try { localStorage.setItem(WEATHER_KEY, JSON.stringify({ cityId: asked.id, at: Date.now(), temp, code })); } catch {}
      }
    } catch {
      // 연결이 안 되면 저장본(3시간 이내)을 쓰고, 없으면 조용히 비움
    } finally {
      weatherBusy = false;
    }
    if (city && city.id !== asked.id) return refreshWeather();
    renderWeather();
    fetchCityName(lang);
  }

  // =====================================================================
  // 8. 설정 (일력 종이 뒷면)
  // =====================================================================
  const back = document.getElementById('sheet-back');
  const settingsOpen = document.getElementById('settings-open');
  const settingsDone = document.getElementById('settings-done');

  let turning = false; // 뒤집는 중에 또 누르면 무시
  async function turn(from, to) {
    turning = true;
    const swap = () => {
      calendar.classList.toggle('is-back', to === back);
      back.hidden = to !== back;
    };
    try {
      if (reduceMotion()) return swap();
      await from.animate([{ transform: 'perspective(1800px) rotateY(0deg)' }, { transform: 'perspective(1800px) rotateY(90deg)' }], { duration: 170, easing: 'cubic-bezier(.5, 0, 1, 1)' }).finished;
      swap();
      await to.animate([{ transform: 'perspective(1800px) rotateY(-90deg)' }, { transform: 'perspective(1800px) rotateY(0deg)' }], { duration: 220, easing: 'cubic-bezier(0, 0, .3, 1)' }).finished;
    } finally {
      turning = false;
    }
  }
  async function openSettings(focusId) {
    if (turning) return;
    if (!back.hidden) return document.getElementById(focusId || 'settings-title').focus();
    renderSettings();
    settingsOpen.setAttribute('aria-expanded', 'true');
    settingsOpen.hidden = true;
    await turn(sheet, back);
    document.getElementById(focusId || 'settings-title').focus();
  }
  async function closeSettings() {
    if (back.hidden || turning) return;
    datesStatus.hide();
    await turn(back, sheet);
    settingsOpen.hidden = false;
    settingsOpen.setAttribute('aria-expanded', 'false');
    settingsOpen.focus();
  }
  settingsOpen.addEventListener('click', () => openSettings());
  settingsDone.addEventListener('click', closeSettings);

  function renderSettings() {
    back.querySelectorAll('[data-lang]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.lang === lang)));
    back.querySelectorAll('[data-region]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.region === region)));
    renderCityNote();
    renderDates();
    fillLunarOptions();
  }

  back.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => {
    lang = button.dataset.lang;
    saveChoice(LANG_KEY, lang);
    applyLanguage();
  }));
  back.querySelectorAll('[data-region]').forEach(button => button.addEventListener('click', () => {
    region = button.dataset.region;
    saveChoice(REGION_KEY, region);
    renderSettings();
    fillSheet(sheet, new Date());
    renderWeather();
  }));

  // ---- 날씨 도시 찾기 ----
  const cityForm = document.getElementById('city-form');
  const cityInput = document.getElementById('city-input');
  const cityCands = document.getElementById('city-cands');
  const cityError = document.getElementById('city-error');
  const cityCurrent = document.getElementById('city-current');

  function renderCityNote() {
    cityCurrent.replaceChildren();
    if (!city) {
      cityCurrent.textContent = t('cityNone');
      return;
    }
    cityCurrent.append(t('cityCurrent', cityName()), ' ');
    const off = document.createElement('button');
    off.type = 'button';
    off.className = 'text-button';
    off.textContent = t('cityOff');
    off.addEventListener('click', () => {
      saveCity(null);
      renderCityNote();
      renderWeather();
      cityInput.focus();
    });
    cityCurrent.append(off);
  }
  function showCityError(key) {
    cityError.textContent = key ? t(key) : '';
    cityInput.setAttribute('aria-invalid', String(Boolean(key)));
  }
  let citySearchId = 0;
  cityForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const query = cityInput.value.trim();
    const searchId = ++citySearchId;
    cityCands.replaceChildren();
    if (Array.from(query).length < 2) return showCityError('cityTooShort');
    showCityError('');
    try {
      const data = await getJson(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=${lang}&format=json`);
      const results = Array.isArray(data.results) ? data.results : [];
      if (searchId !== citySearchId) return;
      if (!results.length) return showCityError('cityNotFound');
      for (const place of results) {
        const candidate = cleanCity({ id: place.id, lat: place.latitude, lon: place.longitude, names: { [lang]: place.name } });
        if (!candidate) continue;
        const li = document.createElement('li');
        const button = document.createElement('button');
        button.type = 'button';
        const name = document.createElement('span');
        name.textContent = candidate.names[lang];
        const where = document.createElement('small');
        where.textContent = [place.admin1, place.country].filter(value => typeof value === 'string' && value !== place.name).map(cleanName).filter(Boolean).join(' · ');
        button.append(name, where);
        button.addEventListener('click', () => {
          saveCity(candidate);
          cityCands.replaceChildren();
          cityInput.value = '';
          renderCityNote();
          refreshWeather();
          cityCurrent.querySelector('button')?.focus();
        });
        li.append(button);
        cityCands.append(li);
      }
      cityCands.querySelector('button')?.focus();
    } catch {
      showCityError('cityOffline');
    }
  });

  // ---- 기념일 · D-day 목록과 추가 칸 ----
  const datesList = document.getElementById('dates-list');
  const dateForm = document.getElementById('date-form');
  const dateError = document.getElementById('date-error');
  const lunarPick = dateForm.querySelector('.lunar-pick');
  const datesStatus = makeStatus(document.getElementById('dates-status'), () => dateForm.elements.name);
  let dateCal = 'solar';
  let repeatBeforeLunar = true;

  function describeDate(item, today) {
    if (item.repeat) return item.cal === 'lunar' ? t('dateAnnivLunar', item.m, item.d) : t('dateAnnivSolar', item.m, item.d);
    return t('dateDday', item.y, item.m, item.d, daysUntil(item, today));
  }
  function renderDates() {
    const today = new Date();
    const rows = dates.map((item, index) => {
      const li = document.createElement('li');
      const name = document.createElement('span');
      name.className = 'date-name';
      name.textContent = item.name;
      const when = document.createElement('span');
      when.className = 'date-when';
      when.textContent = describeDate(item, today);
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'text-button is-danger';
      remove.textContent = t('delete');
      remove.setAttribute('aria-label', t('deleteDate', item.name));
      remove.addEventListener('click', () => removeDate(index));
      li.append(name, when, remove);
      return li;
    });
    if (!rows.length) {
      const empty = document.createElement('li');
      empty.className = 'dates-empty';
      empty.textContent = t('datesEmpty');
      rows.push(empty);
    }
    datesList.replaceChildren(...rows);
  }
  function removeDate(index) {
    const previous = dates;
    const removed = dates[index];
    if (!saveDates(dates.filter((_, i) => i !== index))) return datesStatus.show(t('errStorage'));
    renderDates();
    fillSheet(sheet, new Date());
    const rest = datesList.querySelectorAll('.is-danger');
    (rest[Math.min(index, rest.length - 1)] || dateForm.elements.name).focus();
    datesStatus.show(t('removed', removed.name), () => {
      if (!saveDates(previous)) return datesStatus.show(t('undoFail'));
      datesStatus.hide();
      renderDates();
      fillSheet(sheet, new Date());
      dateForm.elements.name.focus();
    });
  }
  function fillLunarOptions() {
    const fill = (select, count, label) => {
      const current = select.value;
      select.replaceChildren(...Array.from({ length: count }, (_, i) => {
        const option = document.createElement('option');
        option.value = String(i + 1);
        option.textContent = t(label, i + 1);
        return option;
      }));
      select.value = current || '1';
    };
    fill(dateForm.elements.lunarMonth, 12, 'lunarMonthOption');
    fill(dateForm.elements.lunarDay, 30, 'lunarDayOption');
  }
  // 음력이면 월·일 고르기, 해마다 반복만 가능 / 양력이면 날짜 고르기
  function setDateCal(cal) {
    dateCal = cal;
    dateForm.querySelectorAll('[data-cal]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.cal === cal)));
    const lunar = cal === 'lunar';
    dateForm.elements.date.hidden = lunar;
    lunarPick.hidden = !lunar;
    const repeat = dateForm.elements.repeat;
    if (lunar && !repeat.disabled) repeatBeforeLunar = repeat.checked;
    if (!lunar && repeat.disabled) repeat.checked = repeatBeforeLunar;
    if (lunar) repeat.checked = true;
    repeat.disabled = lunar;
  }
  dateForm.querySelectorAll('[data-cal]').forEach(button => button.addEventListener('click', () => setDateCal(button.dataset.cal)));
  function showDateError(key, ...args) {
    dateError.textContent = key ? t(key, ...args) : '';
  }
  dateForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const fields = dateForm.elements;
    const name = cleanName(fields.name.value);
    if (!name) {
      showDateError('errDateName');
      return fields.name.focus();
    }
    if (dates.length >= MAX_DATES) return showDateError('errDatesMax', MAX_DATES);
    let item;
    if (dateCal === 'lunar') {
      item = cleanDate({ name, repeat: true, cal: 'lunar', m: fields.lunarMonth.value, d: fields.lunarDay.value });
    } else {
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(fields.date.value);
      if (!match) {
        showDateError('errDateValue');
        return fields.date.focus();
      }
      item = cleanDate({ name, repeat: fields.repeat.checked, cal: 'solar', y: match[1], m: match[2], d: match[3] });
      if (item && !item.repeat && daysUntil(item, new Date()) < 0) return showDateError('errDdayPast');
    }
    if (!item) return showDateError('errDateValue');
    if (!saveDates([...dates, item])) return showDateError('errStorage');
    showDateError('');
    datesStatus.hide();
    fields.name.value = '';
    fields.date.value = '';
    renderDates();
    fillSheet(sheet, new Date());
    fields.name.focus();
  });

  // =====================================================================
  // 9. 자주 가는 곳
  // =====================================================================
  // 기본 목록: 처음 열었을 때 보이는 사이트. 페이지의 '편집'으로 고치면 이 브라우저에 따로 저장되고,
  // 그때부터는 저장된 목록이 먼저예요. (숫자 키 1~9 때문에 9개까지)
  // 페이지에서 고친 뒤 이 기본 목록으로 돌아가려면: 페이지의 '편집' → '기본 목록으로' (메모는 그대로 남아요)
  const DEFAULT_LINKS = [
    { name: '구글', url: 'https://www.google.com' },
    { name: '지메일', url: 'https://mail.google.com' },
    { name: '유튜브', url: 'https://www.youtube.com' },
    { name: '유튜브 뮤직', url: 'https://music.youtube.com' }
  ];
  const LINKS_KEY = 'start-page-links';
  const MAX_LINKS = 9;
  // 위 목록도 저장된 목록과 똑같이 검사함: 'naver.com'처럼 써도 되고, 잘못 쓴 줄은 건너뛰고, 9개까지만 씀
  const DEFAULTS = DEFAULT_LINKS.slice(0, MAX_LINKS).map(cleanLink).filter(Boolean);
  const linksList = document.querySelector('.links');
  const editButton = document.getElementById('links-edit');
  const resetButton = document.getElementById('links-reset');
  const linkForm = document.getElementById('link-form');
  const formError = linkForm.querySelector('.form-error');
  const linksStatus = makeStatus(document.getElementById('links-status'), () => editButton);
  let links = loadLinks();
  let editing = false;
  let editingIndex = -1; // -1 = 새로 추가

  // 'naver.com' 처럼 써도 https:// 를 붙여 줌. http/https 주소만 받음 (javascript: 같은 건 거부)
  function normalizeUrl(text) {
    const trimmed = String(text || '').trim();
    if (!trimmed || trimmed.length > 2048) return null;
    const withScheme = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
    try {
      const url = new URL(withScheme);
      if (!['http:', 'https:'].includes(url.protocol) || !url.hostname.includes('.')) return null;
      url.username = '';
      url.password = ''; // 주소 안의 아이디·비밀번호는 저장하지 않음
      return url.href;
    } catch {
      return null;
    }
  }
  function cleanLink(item) {
    if (!item || typeof item !== 'object') return null;
    const url = normalizeUrl(item.url);
    return url ? { name: cleanName(item.name) || shortHost(url), url } : null;
  }
  function loadLinks() {
    try {
      const saved = JSON.parse(localStorage.getItem(LINKS_KEY));
      if (Array.isArray(saved)) return saved.slice(0, MAX_LINKS).map(cleanLink).filter(Boolean);
    } catch {
      // 저장된 목록이 없거나 깨졌으면 기본 목록 사용
    }
    return DEFAULTS;
  }
  function saveLinks(next) {
    try {
      localStorage.setItem(LINKS_KEY, JSON.stringify(next));
    } catch {
      return false;
    }
    links = next;
    return true;
  }
  function hasSavedLinks() {
    try {
      return localStorage.getItem(LINKS_KEY) !== null;
    } catch {
      return false;
    }
  }
  function shortHost(url) {
    return new URL(url).hostname.replace(/^www\./, '');
  }
  function monogram(link) {
    const letter = document.createElement('span');
    letter.className = 'monogram';
    letter.setAttribute('aria-hidden', 'true');
    letter.textContent = Array.from(link.name)[0] || '';
    return letter;
  }

  // 사이트 아이콘: DuckDuckGo 아이콘 서비스에서 가져오고(사이트 주소의 도메인만 전달됨), 못 가져오면 이름 첫 글자로 대신함.
  // 알려진 한계: DuckDuckGo가 아이콘을 모르는 사이트에는 회색 '›' 그림을 보내 줘요. 진짜 아이콘과 크기가 같아서
  // 이 페이지에서는 구별할 수 없어요(보안상 다른 사이트 그림의 내용은 읽을 수 없음).
  // 집·회사 안의 주소(192.168…, .local 등)는 밖으로 알리지 않도록 처음부터 첫 글자로 표시
  const PRIVATE_HOST = /^[\d.]+$|\.(local|lan|internal|home\.arpa|corp)$/i;
  function siteIcon(link) {
    const hostname = new URL(link.url).hostname;
    if (PRIVATE_HOST.test(hostname)) return monogram(link);
    const icon = document.createElement('img');
    icon.className = 'favicon';
    icon.alt = '';
    icon.width = 28;
    icon.height = 28;
    icon.referrerPolicy = 'no-referrer';
    icon.src = `https://icons.duckduckgo.com/ip3/${encodeURIComponent(hostname)}.ico`;
    icon.addEventListener('error', () => icon.replaceWith(monogram(link)), { once: true });
    return icon;
  }

  // 앞으로(◀) · 뒤로(▶) 버튼 그림: 직접 그린 작은 꺾쇠
  function chevron(direction) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 14 14');
    svg.setAttribute('aria-hidden', 'true');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', direction < 0 ? 'M9 2.5 4.5 7 9 11.5' : 'M5 2.5 9.5 7 5 11.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'currentColor');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    svg.append(path);
    return svg;
  }
  function moveButtons(link, index) {
    const group = document.createElement('div');
    group.className = 'move';
    for (const step of [-1, 1]) {
      const button = document.createElement('button');
      button.type = 'button';
      button.dataset.step = String(step);
      button.setAttribute('aria-label', t(step < 0 ? 'moveEarlier' : 'moveLater', link.name));
      button.disabled = (step < 0 && index === 0) || (step > 0 && index === links.length - 1);
      button.append(chevron(step));
      button.addEventListener('click', () => moveLink(index, step));
      group.append(button);
    }
    return group;
  }
  function moveLink(index, step) {
    const target = index + step;
    if (target < 0 || target >= links.length) return;
    const next = [...links];
    [next[index], next[target]] = [next[target], next[index]];
    if (!saveLinks(next)) return linksStatus.show(t('errStorage'));
    closeForm();
    renderLinks();
    // 옮겨 간 카드의 같은 버튼에 포커스 (끝에 닿아 못 누르면 반대쪽 버튼)
    const group = linksList.querySelectorAll('.move')[target];
    const same = group?.querySelector(`[data-step="${step}"]`);
    (same && !same.disabled ? same : group?.querySelector(`[data-step="${-step}"]`))?.focus();
  }

  function linkCard(link, index) {
    const card = document.createElement(editing ? 'button' : 'a');
    card.className = 'paper link-card';
    card.title = link.name; // 이름이 잘려 보일 때 마우스를 올리면 전체 이름
    if (editing) {
      card.type = 'button';
      card.setAttribute('aria-label', t('editCard', link.name));
      card.addEventListener('click', () => openForm(index));
    } else {
      card.href = link.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.setAttribute('aria-keyshortcuts', String(index + 1));
    }
    const label = document.createElement('span');
    label.className = 'label';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = link.name;
    const host = document.createElement('span');
    host.className = 'url';
    host.setAttribute('aria-hidden', 'true');
    host.textContent = shortHost(link.url);
    label.append(name, host);
    card.append(siteIcon(link), label);
    return card;
  }
  function renderLinks() {
    const items = links.map((link, index) => {
      const li = document.createElement('li');
      li.append(linkCard(link, index));
      if (editing) li.append(moveButtons(link, index));
      return li;
    });
    if (editing && links.length < MAX_LINKS) {
      const li = document.createElement('li');
      const add = document.createElement('button');
      add.type = 'button';
      add.className = 'paper link-card is-add';
      add.textContent = t('addSite');
      add.addEventListener('click', () => openForm(-1));
      li.append(add);
      items.push(li);
    }
    if (!items.length) {
      const empty = document.createElement('li');
      empty.className = 'links-empty';
      empty.textContent = t('linksEmpty');
      items.push(empty);
    }
    linksList.replaceChildren(...items);
    linksList.classList.toggle('is-many', links.length > 4);
    resetButton.hidden = !editing || !hasSavedLinks(); // 되돌릴 게 있을 때만 보임
    linksList.classList.remove('is-adding');
    editButton.textContent = t(editing ? 'done' : 'edit');
    document.getElementById('links-note').textContent = t(editing ? 'linksNoteEdit' : 'linksNoteView');
  }

  function openForm(index) {
    editingIndex = index;
    const link = links[index] || { name: '', url: '' };
    linkForm.querySelector('#link-form-title').textContent = t(index < 0 ? 'addSite' : 'editSite');
    linkForm.elements.name.value = link.name;
    linkForm.elements.url.value = link.url;
    linkForm.querySelector('[data-action="delete"]').hidden = index < 0;
    showFormError('');
    linkForm.hidden = false;
    // 고치는 카드 표시, 추가할 때는 '사이트 추가' 칸을 숨김
    linksList.querySelectorAll('.link-card').forEach((card, i) => card.classList.toggle('is-editing', i === index));
    linksList.classList.toggle('is-adding', index < 0);
    linkForm.elements.url.focus();
    linkForm.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
  }
  function showFormError(message) {
    formError.textContent = message;
    linkForm.elements.url.setAttribute('aria-invalid', String(message !== ''));
  }
  function closeForm() {
    linkForm.hidden = true;
    showFormError('');
  }
  // 저장·삭제·취소 뒤: 칸을 닫고, 키보드 포커스를 고치던 카드(없으면 편집 버튼)로 돌려줌
  function finishForm(focusIndex) {
    closeForm();
    renderLinks();
    const cards = linksList.querySelectorAll('.link-card:not(.is-add)');
    const target = focusIndex < 0 ? linksList.querySelector('.is-add') : cards[Math.min(focusIndex, cards.length - 1)];
    (target || editButton).focus();
  }
  function setEditing(on) {
    editing = on;
    if (!on) {
      closeForm();
      linksStatus.hide();
    }
    renderLinks();
  }
  editButton.addEventListener('click', () => setEditing(!editing));

  function restoreLinks(previous) {
    let restored;
    if (previous === DEFAULTS) {
      // 되돌릴 목록이 기본 목록이면 저장하지 않고 지움 (파일의 기본 목록을 계속 따르게)
      try { localStorage.removeItem(LINKS_KEY); restored = true; } catch { restored = false; }
      if (restored) links = DEFAULTS;
    } else {
      restored = saveLinks(previous);
    }
    if (!restored) return linksStatus.show(t('undoFail'));
    closeForm();
    linksStatus.hide();
    renderLinks();
    editButton.focus();
  }
  resetButton.addEventListener('click', () => {
    const previous = links;
    try {
      if (localStorage.getItem(LINKS_KEY) === null) return linksStatus.show(t('alreadyDefault'));
      localStorage.removeItem(LINKS_KEY);
    } catch {
      return linksStatus.show(t('resetFail'));
    }
    links = DEFAULTS;
    closeForm();
    renderLinks();
    editButton.focus(); // 누른 버튼이 사라지니 포커스를 편집 버튼으로
    linksStatus.show(t('resetDone'), () => restoreLinks(previous));
  });
  linkForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const url = normalizeUrl(linkForm.elements.url.value);
    if (!url) {
      showFormError(t(linkForm.elements.url.value.trim() ? 'errUrlBad' : 'errUrlEmpty'));
      linkForm.elements.url.focus();
      return;
    }
    const name = cleanName(linkForm.elements.name.value) || shortHost(url);
    const item = { name, url };
    const next = editingIndex < 0
      ? [...links, item]
      : links.map((link, index) => (index === editingIndex ? item : link));
    if (next.length > MAX_LINKS) return showFormError(t('errLinksMax', MAX_LINKS));
    if (!saveLinks(next)) return showFormError(t('errStorage'));
    linksStatus.hide();
    finishForm(editingIndex < 0 ? next.length - 1 : editingIndex);
  });
  linkForm.querySelector('[data-action="cancel"]').addEventListener('click', () => finishForm(editingIndex));
  linkForm.querySelector('[data-action="delete"]').addEventListener('click', () => {
    const previous = links;
    const removed = links[editingIndex];
    if (!saveLinks(links.filter((_, index) => index !== editingIndex))) return showFormError(t('errStorage'));
    finishForm(editingIndex);
    linksStatus.show(t('removed', removed.name), () => restoreLinks(previous));
  });

  // =====================================================================
  // 10. 언어 적용: 화면의 모든 글자를 지금 언어로
  // =====================================================================
  const search = document.querySelector('.search input');
  function applyLanguage() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-t-placeholder]').forEach(el => { el.placeholder = t(el.dataset.tPlaceholder); });
    document.querySelectorAll('[data-t-label]').forEach(el => el.setAttribute('aria-label', t(el.dataset.tLabel)));
    // 단축키 안내: [키, 글, 키, 글, ...] 순서
    const keyHint = document.getElementById('key-hint');
    keyHint.replaceChildren(...t('keyHint').map((piece, i) => {
      if (i % 2) return document.createTextNode(piece);
      const kbd = document.createElement('kbd');
      kbd.textContent = piece;
      return kbd;
    }));
    showHint();
    renderLinks();
    if (!linkForm.hidden) linkForm.querySelector('#link-form-title').textContent = t(editingIndex < 0 ? 'addSite' : 'editSite');
    if (shownDay) fillSheet(sheet, new Date());
    renderWeather();
    fetchCityName(lang);
    linksStatus.hide();
    datesStatus.hide();
    showCityError('');
    showDateError('');
    if (!linkForm.hidden) showFormError('');
    cityCands.replaceChildren();
    if (!back.hidden) renderSettings();
  }

  // =====================================================================
  // 11. 시계와 날짜 바뀜
  // =====================================================================
  const LAST_DAY_KEY = 'start-page-last-day';
  function rememberDay() {
    try { localStorage.setItem(LAST_DAY_KEY, shownDay); } catch {}
  }
  function tick() {
    const now = new Date();
    const key = now.toDateString();
    if (key !== shownDay) {
      if (shownDay) tearOff();
      prunePastDdays(now);
      fillSheet(sheet, now);
      shownDay = key;
      rememberDay();
      if (!back.hidden) renderDates();
      if (document.activeElement === memo && document.hasFocus()) {
        clearMemoOnBlur = true; // 쓰는 중에는 지우지 않음
      } else {
        try {
          memo.value = loadMemo(key);
        } catch {
          memo.value = '';
          memoError = 'memoNoStorage';
          showHint();
        }
        updateMemoCount();
      }
    }
    const clock = sheet.querySelector('.clock');
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    clock.textContent = `${hh}:${mm}`;
    clock.dateTime = `${hh}:${mm}`;
  }

  // 다른 탭에서 바꾸면 이 탭에도 반영 (서로 덮어쓰지 않게)
  addEventListener('storage', (event) => {
    const key = event.key;
    if (key === MEMO_KEY || key === null) {
      try { memo.value = loadMemo(shownDay); } catch {}
      updateMemoCount();
    }
    if (key === LINKS_KEY || key === null) {
      links = loadLinks();
      closeForm(); // 고치던 칸의 위치가 바뀌었을 수 있으니 닫음
      linksStatus.hide(); // 다른 탭의 새 목록을 옛 목록으로 덮어쓰지 않게
      renderLinks();
    }
    if (key === DATES_KEY || key === null) {
      dates = loadDates();
      datesStatus.hide();
      if (!back.hidden) renderDates();
      fillSheet(sheet, new Date());
    }
    if (key === CITY_KEY || key === null) {
      city = cleanCity(readJson(CITY_KEY));
      if (!back.hidden) renderCityNote();
      refreshWeather();
    }
    if (key === WEATHER_KEY) renderWeather();
    if (key === LANG_KEY || key === REGION_KEY || key === null) {
      lang = loadChoice(LANG_KEY, ['ko', 'en'], lang);
      region = loadChoice(REGION_KEY, ['KR', 'US'], region);
      applyLanguage();
    }
  });

  // 처음 그리기
  applyLanguage();
  // 그날 처음 열면 지난번 종이를 한 장 찢어 보여 줌 (자정에 탭이 열려 있지 않아도 매일 보이게)
  let lastSeenDay = null;
  try { lastSeenDay = localStorage.getItem(LAST_DAY_KEY); } catch {}
  try {
    tick();
  } catch {
    memoError = 'memoNoStorage';
    showHint();
  }
  if (lastSeenDay && lastSeenDay !== shownDay && /^\w{3} \w{3} \d{2} \d{4}$/.test(lastSeenDay)) {
    setTimeout(() => tearOff(new Date(lastSeenDay)), 500);
  }
  setInterval(tick, 1000);
  refreshWeather();
  setInterval(refreshWeather, 5 * 60 * 1000); // 5분마다 확인 (30분이 지났을 때만 새로 받음)
  document.addEventListener('visibilitychange', () => { // 밤새 열어 둔 탭으로 돌아오면 바로 날짜·날씨부터 맞춤
    tick();
    refreshWeather();
  });

  // 검색 결과가 새 탭에서 열리면, 이 탭의 검색창은 비워서 다음 검색을 준비
  search.form.addEventListener('submit', () => setTimeout(() => search.form.reset()));

  // =====================================================================
  // 12. 단축키: / = 검색창, 1~9 = 바로가기 열기, Esc = 지금 칸에서 빠져나오기
  // =====================================================================
  document.addEventListener('keydown', () => document.documentElement.classList.add('used-keyboard'), { once: true });
  document.addEventListener('keydown', (event) => {
    // isComposing·229 = 한글 입력 중 (Safari는 229로만 알려 줌)
    if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || event.isComposing || event.keyCode === 229) return;
    if (event.key === 'Escape') {
      if (event.target === search || event.target === memo) {
        event.preventDefault(); // 검색창이 쓰던 글을 지우지 않게
        event.target.blur();
        return;
      }
      if (linkForm.contains(event.target)) return finishForm(editingIndex);
      if (!back.hidden) return closeSettings();
    }
    if (event.target instanceof Element && event.target.closest('input, textarea, select')) return;
    if (event.key === '/') {
      event.preventDefault();
      search.focus();
      return;
    }
    if (!back.hidden) return;
    const card = /^[1-9]$/.test(event.key) ? linksList.querySelectorAll('a.link-card')[Number(event.key) - 1] : null;
    if (card) card.click();
  });
</script>
</body>
</html>
